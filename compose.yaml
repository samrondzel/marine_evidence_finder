# Local-only Docker Compose deployment. Do not publish publicly: no authentication.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "uvicorn", "marine_evidence.api:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1"]
    init: true
    environment:
      MARINE_PROJECT_ROOT: /app
      MARINE_UPLOADS_DIR: /app/data/app
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - type: bind
        source: ./data/chunks/word_safe
        target: /app/data/chunks/word_safe
        read_only: true
      - type: bind
        source: ./papers
        target: /app/papers
        read_only: true
      - type: bind
        source: ./evaluation/papers_manifest.json
        target: /app/evaluation/papers_manifest.json
        read_only: true
      # This is the SAME folder as the existing local app, so its uploads survive.
      - type: bind
        source: ./data/app
        target: /app/data/app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ui:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "streamlit", "run", "streamlit_app.py", "--server.address=0.0.0.0", "--server.port=8501", "--server.headless=true", "--browser.gatherUsageStats=false"]
    init: true
    environment:
      MARINE_API_URL: http://api:8000
      MARINE_PUBLIC_API_URL: http://127.0.0.1:8000
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
