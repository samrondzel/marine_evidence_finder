groups:
  - name: marine-ingestion
    rules:
      - alert: MarineAPIDown
        expr: up{job="marine-api"} == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Marine Evidence Finder API metrics unavailable
      - alert: MarineReconcilerHeartbeatMissing
        expr: marine_reconciler_last_success_timestamp_seconds == 0 or (time() - marine_reconciler_last_success_timestamp_seconds > 120)
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Reconciler has not completed a healthy pass recently
      - alert: MarineRunningJobTooOld
        expr: marine_oldest_running_job_age_seconds > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: At least one ingestion attempt has been running for over ten minutes
