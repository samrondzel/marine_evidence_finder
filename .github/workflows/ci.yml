name: CI — tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-answer.txt -r requirements-app.txt
          if [ -f requirements-db.txt ]; then
            python -m pip install -r requirements-db.txt
          fi

      - name: Run automated tests (no real OpenAI calls)
        env:
          OPENAI_API_KEY: ''
        run: python -m pytest -q
