name: PostgreSQL — integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL 16 / Alembic / integration
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: marine_evidence_test
          POSTGRES_USER: marine_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U marine_test -d marine_evidence_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      # Only this disposable GitHub Actions service database is used.
      MARINE_TEST_DATABASE_URL: postgresql+psycopg://marine_test:local_ci_only@127.0.0.1:5432/marine_evidence_test
      DATABASE_URL: postgresql+psycopg://marine_test:local_ci_only@127.0.0.1:5432/marine_evidence_test
      OPENAI_API_KEY: ''

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install project and database dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python -m pip install -r requirements-db.txt -r requirements-answer.txt -r requirements-app.txt

      - name: Upgrade schema using Alembic
        run: python -m alembic -c alembic.ini upgrade head

      - name: Verify live PostgreSQL behaviour
        run: python -m pytest -q tests/test_postgres_live.py
